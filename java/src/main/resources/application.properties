server.port=5004

# ViaCEP
viacep.base-url=https://viacep.com.br/ws
viacep.timeout-seconds=10
viacep.cache-minutes=60

# API Key
api.key=sprezzari-sp-203040

# Actuator (Health Check)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Resilience4j Retry
resilience4j.retry.instances.viaCep.maxAttempts=3
resilience4j.retry.instances.viaCep.waitDuration=2s
resilience4j.retry.instances.viaCep.enableExponentialBackoff=true
resilience4j.retry.instances.viaCep.exponentialBackoffMultiplier=2
